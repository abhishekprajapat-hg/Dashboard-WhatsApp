apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatscrm-api
  namespace: whatscrm
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: whatscrm-api
  template:
    metadata:
      labels:
        app: whatscrm-api
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: api
          image: ghcr.io/your-org/whatscrm-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - configMapRef:
                name: whatscrm-config
            - secretRef:
                name: whatscrm-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
